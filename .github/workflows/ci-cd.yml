name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    # Backend Build and Test
    - name: Backend - Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Backend - Install Dependencies
      working-directory: ./news-backend
      run: npm ci
    
    - name: Backend - Run Tests
      working-directory: ./news-backend
      run: npm test
    
    # Frontend Build and Test
    - name: Frontend - Install Dependencies
      working-directory: ./news-frontend
      run: npm ci
    
    - name: Frontend - Build
      working-directory: ./news-frontend
      run: npm run build
    
    # Docker Build
    - name: Docker - Build Backend
      run: docker build -t news-backend ./news-backend
    
    - name: Docker - Build Frontend
      run: docker build -t news-frontend ./news-frontend
    
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Kubernetes
      uses: steebchen/kubectl@v2.0.0
      with:
        config: ${{ secrets.KUBE_CONFIG }}
        command: apply -f k8s-deployment.yaml
    
    - name: Restart Deployments
      uses: steebchen/kubectl@v2.0.0
      with:
        config: ${{ secrets.KUBE_CONFIG }}
        command: rollout restart deployment/news-backend deployment/news-frontend
